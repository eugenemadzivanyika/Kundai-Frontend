name: Deploy frontend to VPS

on:
  push:
    branches:
      - ocr   # change to main when you're ready to make this prod
  workflow_dispatch:  # lets you trigger manually from the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*"
          target: "/tmp/kundai-frontend-build/"
          rm: true
          strip_components: 1
      - name: Swap into /var/www/html and reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            BUILD_ID=$(date +%Y%m%d-%H%M%S)
            sudo mkdir -p /var/www/releases/$BUILD_ID
            sudo cp -r /tmp/kundai-frontend-build/* /var/www/releases/$BUILD_ID/
            sudo chown -R deploy:www-data /var/www/releases/$BUILD_ID
            sudo ln -sfn /var/www/releases/$BUILD_ID /var/www/html-new
            sudo mv -Tf /var/www/html-new /var/www/html
            ls -1t /var/www/releases | tail -n +6 | xargs -I {} sudo rm -rf /var/www/releases/{}
            sudo nginx -t && sudo nginx -s reload
            rm -rf /tmp/kundai-frontend-build
             echo "Deployed $BUILD_ID"
