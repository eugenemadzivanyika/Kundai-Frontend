<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kundai · SysAdmin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-canvas: #0b1220;
    --bg-side: #0d1424;
    --bg-elev-1: #131e35;
    --bg-elev-2: #1a2742;
    --line: #1e2c4a;
    --line-soft: #182542;
    --line-bright: #2a3a5e;
    --ink-hi: #f1f5f9;
    --ink-mid: #cbd5e1;
    --ink-lo: #94a3b8;
    --ink-faint: #64748b;
    --emerald: #10b981;
    --emerald-soft: #34d399;
    --sky: #38bdf8;
    --violet: #a78bfa;
    --amber: #fbbf24;
    --rose: #fb7185;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg-canvas);
    color: var(--ink-mid);
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: 'cv11', 'ss01', 'ss03';
  }
  .mono, .tnum { font-feature-settings: 'tnum' 1; }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; border: 2px solid var(--bg-canvas); }
  ::-webkit-scrollbar-thumb:hover { background: var(--line-bright); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: #34d399; border: 2px solid #0b1220; cursor: pointer;
    box-shadow: 0 0 0 1px rgba(16,185,129,.4), 0 2px 6px rgba(16,185,129,.4);
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%; background: #34d399;
    border: 2px solid #0b1220; cursor: pointer;
  }
  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--emerald-soft);
    outline-offset: 1px;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="src/data.jsx"></script>
<script type="text/babel" src="src/icons.jsx"></script>
<script type="text/babel" src="src/primitives.jsx"></script>
<script type="text/babel" src="src/charts.jsx"></script>
<script type="text/babel" src="src/page-dashboard.jsx"></script>
<script type="text/babel" src="src/page-schools.jsx"></script>
<script type="text/babel" src="src/page-school-detail.jsx"></script>
<script type="text/babel" src="src/page-packages.jsx"></script>
<script type="text/babel" src="src/page-subscriptions.jsx"></script>
<script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
