<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>School Dashboard — Performance Overview Chart</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  .tnum { font-variant-numeric: tabular-nums; }
  .mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body class="bg-slate-100">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useMemo } = React;

// Mock data — what your backend should return
const PERFORMANCE_DATA = {
  // School-wide weekly avg mastery (12 weeks of current term)
  weekly: [
    { week: 'W1', date: '2026-04-13', schoolAvg: 0.51, byForm: { F1: 0.48, F2: 0.50, F3: 0.55, F4: 0.52, F5: 0.49, F6: 0.54 } },
    { week: 'W2', date: '2026-04-20', schoolAvg: 0.53, byForm: { F1: 0.49, F2: 0.52, F3: 0.56, F4: 0.54, F5: 0.51, F6: 0.55 } },
    { week: 'W3', date: '2026-04-27', schoolAvg: 0.54, byForm: { F1: 0.50, F2: 0.53, F3: 0.57, F4: 0.55, F5: 0.53, F6: 0.57 } },
    { week: 'W4', date: '2026-05-04', schoolAvg: 0.56, byForm: { F1: 0.52, F2: 0.55, F3: 0.59, F4: 0.57, F5: 0.55, F6: 0.59 } },
    { week: 'W5', date: '2026-05-11', schoolAvg: 0.58, byForm: { F1: 0.54, F2: 0.57, F3: 0.61, F4: 0.59, F5: 0.57, F6: 0.61 } },
    { week: 'W6', date: '2026-05-18', schoolAvg: 0.59, byForm: { F1: 0.55, F2: 0.58, F3: 0.62, F4: 0.60, F5: 0.58, F6: 0.63 } },
    { week: 'W7', date: '2026-05-25', schoolAvg: 0.61, byForm: { F1: 0.57, F2: 0.60, F3: 0.64, F4: 0.62, F5: 0.60, F6: 0.65 } },
    { week: 'W8', date: '2026-06-01', schoolAvg: 0.62, byForm: { F1: 0.58, F2: 0.61, F3: 0.65, F4: 0.63, F5: 0.62, F6: 0.66 } },
  ],
  current: 0.62,
  previousTerm: 0.54,
  target: 0.70,
};

const FORM_COLORS = {
  schoolAvg: '#0f172a', // slate-900 (the headline line)
  F1: '#3b82f6', // blue-500
  F2: '#10b981', // emerald-500
  F3: '#f59e0b', // amber-500
  F4: '#8b5cf6', // violet-500
  F5: '#ec4899', // pink-500
  F6: '#06b6d4', // cyan-500
};

function PerformanceOverviewChart({ data = PERFORMANCE_DATA }) {
  // toggleable view: aggregate (school avg) vs breakdown (by form)
  const [view, setView] = useState('aggregate'); // 'aggregate' | 'by-form'
  const [period, setPeriod] = useState('term');  // 'term' | '4w' | 'year'

  const lines = view === 'aggregate'
    ? [{ key: 'schoolAvg', label: 'School average', color: FORM_COLORS.schoolAvg, width: 2.5 }]
    : ['F1','F2','F3','F4','F5','F6'].map(f => ({ key: f, label: f, color: FORM_COLORS[f], width: 1.5, byForm: true }));

  const W = 800, H = 220;
  const P = { l: 44, r: 16, t: 18, b: 28 };
  const innerW = W - P.l - P.r;
  const innerH = H - P.t - P.b;
  const xs = (i) => P.l + (i / (data.weekly.length - 1)) * innerW;
  const minY = 0.40, maxY = 0.80;
  const ys = (v) => P.t + (1 - (v - minY) / (maxY - minY)) * innerH;

  const change = data.current - data.previousTerm;
  const changePct = ((change / data.previousTerm) * 100).toFixed(1);

  return (
    <div className="bg-white rounded-lg shadow-md p-5">
      <div className="flex items-start justify-between mb-4 flex-wrap gap-3">
        <div>
          <h3 className="text-lg font-semibold text-slate-800">Performance overview</h3>
          <p className="text-xs text-slate-500 mt-0.5">Average BKT mastery across all students · current term</p>
        </div>
        <div className="flex items-center gap-2">
          <div className="flex items-center bg-slate-100 rounded-md p-0.5">
            {[['aggregate','School avg'], ['by-form','By form']].map(([k,l]) => (
              <button key={k} onClick={() => setView(k)}
                className={`px-3 py-1 text-xs font-semibold rounded ${view === k ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                {l}
              </button>
            ))}
          </div>
          <select value={period} onChange={e => setPeriod(e.target.value)}
            className="text-xs border border-slate-200 bg-white rounded-md px-2 py-1 font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="4w">Last 4 weeks</option>
            <option value="term">This term</option>
            <option value="year">Academic year</option>
          </select>
        </div>
      </div>

      {/* Headline metric */}
      <div className="flex items-end gap-5 mb-3">
        <div>
          <div className="text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Current mastery</div>
          <div className="flex items-baseline gap-2 mt-1">
            <span className="text-3xl font-bold text-slate-900 tnum">{Math.round(data.current*100)}<span className="text-lg text-slate-500">%</span></span>
            <span className={`text-xs font-semibold ${change > 0 ? 'text-emerald-700' : 'text-rose-700'}`}>
              {change > 0 ? '▲' : '▼'} {Math.abs(change*100).toFixed(1)} pts <span className="text-slate-500 font-normal">vs last term</span>
            </span>
          </div>
        </div>
        <div className="border-l border-slate-200 pl-5">
          <div className="text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Target</div>
          <div className="text-3xl font-bold text-slate-400 tnum mt-1">{Math.round(data.target*100)}<span className="text-lg">%</span></div>
        </div>
        <div className="border-l border-slate-200 pl-5">
          <div className="text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Gap to target</div>
          <div className="text-3xl font-bold text-amber-600 tnum mt-1">{Math.round((data.target - data.current)*100)}<span className="text-lg">pts</span></div>
        </div>
        <div className="ml-auto flex flex-col items-end">
          <div className="text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Trend</div>
          <div className="flex items-center gap-1 text-emerald-700 font-semibold text-sm mt-1">
            <span>+ 11 pts</span>
            <span className="text-xs text-slate-500 font-normal">in 8 wks</span>
          </div>
        </div>
      </div>

      {/* Chart */}
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ height: H }}>
        <defs>
          <linearGradient id="schoolGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={FORM_COLORS.schoolAvg} stopOpacity="0.10" />
            <stop offset="100%" stopColor={FORM_COLORS.schoolAvg} stopOpacity="0" />
          </linearGradient>
        </defs>

        {/* Grid + y-axis labels */}
        {[0.40, 0.50, 0.60, 0.70, 0.80].map((v, i) => (
          <g key={i}>
            <line x1={P.l} y1={ys(v)} x2={W - P.r} y2={ys(v)} stroke="#e2e8f0" strokeDasharray={v === 0.40 ? '0' : '2 4'} />
            <text x={P.l - 8} y={ys(v) + 3} fontSize="10" fill="#94a3b8" textAnchor="end" className="mono">{Math.round(v*100)}%</text>
          </g>
        ))}

        {/* Target line */}
        <line x1={P.l} y1={ys(data.target)} x2={W - P.r} y2={ys(data.target)} stroke="#f59e0b" strokeDasharray="6 3" strokeWidth="1.5" />
        <text x={W - P.r} y={ys(data.target) - 4} fontSize="9" fill="#b45309" textAnchor="end" fontWeight="700" className="mono">TARGET {Math.round(data.target*100)}%</text>

        {/* Area fill (aggregate view only) */}
        {view === 'aggregate' && (
          <path d={`M ${xs(0)} ${ys(minY)} ${data.weekly.map((d, i) => `L ${xs(i)} ${ys(d.schoolAvg)}`).join(' ')} L ${xs(data.weekly.length-1)} ${ys(minY)} Z`} fill="url(#schoolGrad)" />
        )}

        {/* Lines */}
        {lines.map((line) => {
          const path = data.weekly.map((d, i) => `${i === 0 ? 'M' : 'L'} ${xs(i)} ${ys(line.byForm ? d.byForm[line.key] : d[line.key])}`).join(' ');
          return (
            <g key={line.key}>
              <path d={path} fill="none" stroke={line.color} strokeWidth={line.width} strokeLinejoin="round" strokeLinecap="round" />
              {data.weekly.map((d, i) => (
                <circle key={i} cx={xs(i)} cy={ys(line.byForm ? d.byForm[line.key] : d[line.key])} r="3" fill="white" stroke={line.color} strokeWidth="1.5" />
              ))}
            </g>
          );
        })}

        {/* X-axis labels */}
        {data.weekly.map((d, i) => (
          <text key={i} x={xs(i)} y={H - 8} fontSize="10" fill="#94a3b8" textAnchor="middle" className="mono">{d.week}</text>
        ))}
      </svg>

      {/* Legend */}
      <div className="flex flex-wrap items-center gap-x-4 gap-y-1.5 mt-2 pt-3 border-t border-slate-100">
        {lines.map(line => (
          <div key={line.key} className="flex items-center gap-1.5 text-xs text-slate-600">
            <span className="inline-block w-3 h-0.5" style={{ background: line.color, height: line.width }} />
            <span className="font-medium">{line.label}</span>
          </div>
        ))}
        <div className="flex items-center gap-1.5 text-xs text-slate-500 ml-auto">
          <span className="inline-block w-3 border-t-2 border-dashed border-amber-500" />
          Target line
        </div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Empty / loading / error states (for completeness, since the review flagged UX-1)
// ---------------------------------------------------------------------------
function ChartLoadingState() {
  return (
    <div className="bg-white rounded-lg shadow-md p-5 animate-pulse">
      <div className="flex justify-between mb-4">
        <div className="space-y-2">
          <div className="h-4 w-44 bg-slate-200 rounded" />
          <div className="h-3 w-64 bg-slate-200 rounded" />
        </div>
        <div className="flex gap-2">
          <div className="h-7 w-28 bg-slate-200 rounded" />
          <div className="h-7 w-24 bg-slate-200 rounded" />
        </div>
      </div>
      <div className="h-[220px] bg-slate-100 rounded" />
    </div>
  );
}

function ChartEmptyState() {
  return (
    <div className="bg-white rounded-lg shadow-md p-8 text-center">
      <div className="mx-auto w-12 h-12 bg-slate-100 rounded-full grid place-items-center mb-3">
        <svg className="w-6 h-6 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 6-6"/></svg>
      </div>
      <h3 className="font-semibold text-slate-800">No performance data yet</h3>
      <p className="text-sm text-slate-500 mt-1 max-w-md mx-auto">Once students start completing assessments, the BKT engine will compute mastery scores and this chart will populate. Try generating a few assessments to seed the data.</p>
      <button className="mt-4 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-md">Create your first assessment</button>
    </div>
  );
}

function ChartErrorState({ onRetry }) {
  return (
    <div className="bg-rose-50 border border-rose-200 rounded-lg p-5">
      <div className="flex items-start gap-3">
        <div className="w-9 h-9 bg-rose-100 rounded-full grid place-items-center shrink-0">
          <svg className="w-5 h-5 text-rose-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <div className="flex-1">
          <div className="font-semibold text-slate-900">Couldn't load performance data</div>
          <div className="text-sm text-slate-600 mt-0.5">The BKT analytics service didn't respond. Your dashboard counts are still accurate.</div>
          <button onClick={onRetry} className="mt-3 px-3 py-1.5 bg-white border border-rose-200 hover:bg-rose-50 text-rose-700 text-xs font-semibold rounded">Retry</button>
        </div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Demo page — shows all three states so reviewers can pick
// ---------------------------------------------------------------------------
function Demo() {
  const [demoState, setDemoState] = useState('loaded');
  return (
    <div className="min-h-screen bg-slate-100 p-8">
      <div className="max-w-5xl mx-auto">
        <div className="flex items-center justify-between mb-6">
          <div>
            <h1 className="text-2xl font-bold text-slate-900">Dashboard performance chart</h1>
            <p className="text-sm text-slate-500 mt-1">Drop-in component for <code className="bg-slate-200 px-1.5 py-0.5 rounded text-xs font-mono">SchoolDashboardPage.tsx</code> · addresses MISS-2 and UX-1</p>
          </div>
          <div className="flex gap-1 bg-slate-200 p-1 rounded-md">
            {['loaded','loading','empty','error'].map(s => (
              <button key={s} onClick={() => setDemoState(s)}
                className={`px-3 py-1 text-xs font-semibold rounded ${demoState === s ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-800'}`}>
                {s}
              </button>
            ))}
          </div>
        </div>

        {/* Mock KPI row above (showing what the chart sits alongside) */}
        <div className="grid grid-cols-4 gap-4 mb-5">
          {[
            { label: 'Students', value: 480, accent: 'bg-blue-600' },
            { label: 'Teachers', value: 16,  accent: 'bg-blue-700' },
            { label: 'Subjects', value: 14,  accent: 'bg-cyan-600' },
            { label: 'Classes',  value: 18,  accent: 'bg-purple-600' },
          ].map((m, i) => (
            <div key={i} className="bg-white rounded-lg shadow-md p-4 flex items-center gap-3">
              <div className={`w-9 h-9 ${m.accent} rounded-md`}></div>
              <div>
                <div className="text-xs text-slate-500 font-semibold uppercase tracking-wider">{m.label}</div>
                <div className="text-2xl font-bold text-slate-900 tnum">{m.value}</div>
              </div>
            </div>
          ))}
        </div>

        {/* The chart */}
        {demoState === 'loaded'  && <PerformanceOverviewChart />}
        {demoState === 'loading' && <ChartLoadingState />}
        {demoState === 'empty'   && <ChartEmptyState />}
        {demoState === 'error'   && <ChartErrorState onRetry={() => setDemoState('loaded')} />}

        {/* Spec notes */}
        <div className="mt-8 bg-white rounded-lg border border-slate-200 p-5">
          <h2 className="font-semibold text-slate-900 mb-2">Notes for implementation</h2>
          <ul className="text-sm text-slate-600 space-y-1.5 list-disc pl-5">
            <li><b>MISS-2:</b> Place this chart inside <code className="bg-slate-100 px-1 text-xs">SchoolDashboardPage.tsx</code> directly under the KPI grid, replacing the empty space where <code className="bg-slate-100 px-1 text-xs">avgClassMastery</code> currently goes unused.</li>
            <li><b>Backend gap:</b> <code className="bg-slate-100 px-1 text-xs">adminService.getSummary()</code> currently returns <code className="bg-slate-100 px-1 text-xs">avgClassMastery: 0</code> hardcoded. Add a real query: AVG over <code className="bg-slate-100 px-1 text-xs">StudentAttribute.mastery_score</code> grouped by school + week, returned as <code className="bg-slate-100 px-1 text-xs">weekly[]</code>.</li>
            <li><b>UX-1:</b> The error and empty states cover the failure case the review called out — render them based on the result of the fetch instead of falling through to zeroed KPIs.</li>
            <li><b>View toggle:</b> "By form" splits the line into six per-form series. Useful when leadership wants to spot which form is dragging the average down.</li>
            <li><b>Target line:</b> Make this configurable per school in Settings (default 70%). It anchors the chart and lets the head set a visible goal.</li>
          </ul>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
