<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Handoff Flight — Laptop → Phone</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  html, body { margin: 0; padding: 0; background: #f1f5f9; font-family: 'Inter Tight', Inter, system-ui, sans-serif; color: #0f172a; }
  body {
    background-image: radial-gradient(circle, rgb(148 163 184 / .35) 1px, transparent 1.2px);
    background-size: 24px 24px;
    min-height: 100vh;
  }
  .page {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    min-height: 100vh;
    box-sizing: border-box;
  }
  .copy { text-align: center; max-width: 640px; }
  .copy h1 { font-size: 32px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.05; margin: 8px 0 10px; }
  .copy h1 em { color: #2563eb; font-style: normal; }
  .copy p { color: #475569; font-size: 14px; line-height: 1.55; margin: 0 auto; }
  .eyebrow { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.18em; color: #2563eb; }
  .narration { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; max-width: 480px; text-align: left; }
  .nar-row { display: flex; gap: 14px; align-items: flex-start; font-size: 13px; line-height: 1.4; }
  .nar-dot { width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; margin-top: 6px; flex-shrink: 0; transition: all .3s; }
  .nar-row.active .nar-dot { background: #2563eb; box-shadow: 0 0 0 4px rgba(37,99,235,0.14); width: 10px; height: 10px; margin-top: 5px; }
  .nar-row.active .nar-text { color: #0f172a; font-weight: 700; }
  .nar-row.past .nar-dot { background: #93c5fd; }
  .nar-row.past .nar-text { color: #94a3b8; font-weight: 500; }
  .nar-text { color: #cbd5e1; font-weight: 400; transition: color .3s; }
  .replay {
    margin-top: 16px;
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid #cbd5e1; background: white;
    padding: 8px 14px; border-radius: 8px;
    font-size: 13px; font-weight: 600; color: #334155;
    cursor: pointer;
  }
  .replay:hover { border-color: #94a3b8; }
  .stage-wrap { width: 100%; display: flex; justify-content: center; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="handoff.jsx"></script>
</body>
</html>
